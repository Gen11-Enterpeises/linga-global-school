<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login - LGS</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FAF6EE;
    --ink: #2B2417;
    --rule: #DCD0B4;
    --marigold: #E0A526;
    --maroon: #8C2F1B;
    --clay-light: #F1E6D0;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Work Sans', sans-serif;
    background: var(--paper);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    background-image: linear-gradient(var(--rule) 1px, transparent 1px);
    background-size: 100% 2.2rem;
  }
  .card {
    background: var(--paper);
    border: 1px solid var(--rule);
    padding: 2.5rem 2.25rem 2rem;
    width: 340px;
    box-shadow: 4px 4px 0 var(--rule);
  }
  .mark {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.5rem;
    margin: 0 0 0.15rem;
  }
  .sub {
    font-size: 0.8rem;
    color: #6b5f45;
    margin: 0 0 1.75rem;
  }
  label {
    display: block;
    font-size: 0.75rem;
    color: #6b5f45;
    margin-bottom: 0.3rem;
  }
  input {
    width: 100%;
    padding: 0.6rem 0.7rem;
    margin-bottom: 1.1rem;
    border: 1px solid var(--rule);
    background: white;
    color: var(--ink);
    font-family: inherit;
    font-size: 0.95rem;
  }
  input:focus {
    outline: 2px solid var(--marigold);
    outline-offset: 1px;
  }
  button {
    width: 100%;
    padding: 0.7rem;
    background: var(--maroon);
    color: var(--paper);
    border: none;
    font-family: inherit;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:hover { background: #74250f; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  #msg {
    color: #a12f1f;
    font-size: 0.82rem;
    margin-top: 0.85rem;
    min-height: 1rem;
  }
</style>
</head>
<body>

<div class="card">
  <p class="mark">LGS Office</p>
  <p class="sub">Sign in to manage gallery &amp; announcements</p>
  <form id="loginForm">
    <label for="email">Email</label>
    <input type="email" id="email" required />
    <label for="password">Password</label>
    <input type="password" id="password" required />
    <button type="submit">Sign in</button>
    <p id="msg"></p>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const supabase = window.supabase.createClient(
    'https://fheuzsampabrzvkogodc.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZoZXV6c2FtcGFicnp2a29nb2RjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwNzk1MTUsImV4cCI6MjA5ODY1NTUxNX0.RQKsj983dtIuAWoFvC_ZE2EnadaQ8_J-d8-TWoFnYZc'
  )

  supabase.auth.getSession().then(({ data: { session } }) => {
    if (session) window.location.href = 'admin-upload.html'
  })

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault()
    const btn = e.target.querySelector('button')
    const email = document.getElementById('email').value
    const password = document.getElementById('password').value
    const msg = document.getElementById('msg')
    msg.textContent = ''
    btn.disabled = true

    const { error } = await supabase.auth.signInWithPassword({ email, password })
    if (error) {
      msg.textContent = 'Login failed — check your email and password.'
      btn.disabled = false
      return
    }
    window.location.href = 'admin-upload.html'
  })
</script>

</body>
</html>
